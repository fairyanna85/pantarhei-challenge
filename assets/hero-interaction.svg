<text x="40" y="192" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">1  Pilots that report success self-select keen teams   Survivorship bias   serious</text>
<text x="40" y="214" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">2  Same deadlines in 4 days raises daily load         Second-order         FATAL unless scope drops</text>
<text x="40" y="236" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">3  Partner SLAs assume 5-day coverage                  Key assumptions      serious</text>
