<text x="40" y="126" font-family="'JetBrains Mono','DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="14" fill="#F6F4EF" xml:space="preserve">STEELMAN  Burnout is driven by sustained load without recovery; a structural day off…</text>
